<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blocklens — indexed on-chain intelligence</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{margin:0;background:#07111b;color:#dff7ff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:36px 24px}nav{display:flex;justify-content:space-between;border-bottom:1px solid #194250;padding:14px 0}h1{font-size:clamp(3rem,9vw,7rem);line-height:.9;color:#5eead4;margin:70px 0 20px}.hero{min-height:62vh}p{color:#a8bec8;line-height:1.7;max-width:720px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{padding:22px;background:#0d2530;border:1px solid #194250;border-radius:18px}button{padding:12px 18px;border:0;border-radius:999px;background:#5eead4;font-weight:700;cursor:pointer}a{color:#5eead4}.tag{color:#5eead4}footer{margin-top:70px;border-top:1px solid #194250;padding-top:24px}</style></head><body><div id="root"></div><script type="text/babel">function App(){const[open,setOpen]=React.useState(false);return <main><nav><b>◈ BLOCKLENS</b><span><a href="#problem">Problem</a>　<a href="https://github.com/ShreyaKanchan/blocklens">Source ↗</a></span></nav><section className="hero"><p className="tag">ON-CHAIN OBSERVABILITY / INDEXER PROTOTYPE</p><h1>See the chain as a living map.</h1><p>Blocklens turns raw transfer events into clear wallet activity views. It helps builders answer the basic questions that block explorers often make tedious: what moved, where did it go, and what happened next?</p><button onClick={()=>setOpen(true)}>Open explorer demo</button></section><section id="problem"><p className="tag">THE PROBLEM</p><h2>Raw events are not a useful user experience.</h2><p>Transfer logs are structured for machines, not people. Blocklens experiments with a normalized activity model that can power wallet timelines, analytics, and investigation tools.</p></section><section><p className="tag">CAPABILITIES</p><div className="grid"><article className="card"><h3>Wallet timelines</h3><p>Trace assets across addresses with a chronological view.</p></article><article className="card"><h3>Event normalization</h3><p>Turn varied token transfer events into one readable shape.</p></article><article className="card"><h3>Indexer API</h3><p>Connect the TypeScript decoder and server prototype to a real data source.</p></article></div></section><section><p className="tag">HOW TO USE THIS PROJECT</p><div className="grid"><article className="card"><b>Read the model</b><p>Start with the decoder and architecture notes.</p></article><article className="card"><b>Run the tests</b><p>Use the test cases to understand expected event behavior.</p></article><article className="card"><b>Build the UI</b><p>Add network adapters and an authenticated explorer workflow.</p></article></div></section>{open&&<div className="card"><h2>Mock explorer session</h2><input placeholder="Email"/><input placeholder="Password" type="password"/> <button onClick={()=>setOpen(false)}>Continue</button><p>No credentials are collected. This is a frontend demo.</p></div>}<footer><b>Blocklens</b><p>Educational prototype by Shreya Kanchan. Not financial or production infrastructure.</p></footer></main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
